<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tile 2048 — Game ONN Prime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23c8ff2e'/%3E%3Cpath d='M25 19.5v25L47 32z' fill='%2305060a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared.css">
<style>
  .stage { width: min(92vw, 470px); padding: 10px; }
  .board-wrap { position: relative; }
  #board {
    position: relative; width: 100%; aspect-ratio: 1; border-radius: 11px; overflow: hidden;
    background-color: #0b0f15;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 25% 25%;
    background-position: -1px -1px;
  }
  .tile {
    position: absolute; display: grid; place-items: center;
    border-radius: 9px; font-weight: 700; letter-spacing: -0.04em;
    transition: transform 0.09s ease-out, background 0.12s, color 0.12s;
    will-change: transform;
  }
  .tile.pop { animation: pop 0.16s ease-out; }
  @keyframes pop { from { transform: scale(0.82); } }
  .tile.s1 { background: #1a2029; color: #7d8794; }
  .tile.s2 { background: #232b36; color: #b9c2cc; }
  .tile.s3 { background: #2e3b2c; color: #d8ecc0; }
  .tile.s4 { background: #3f5c22; color: #ecffd2; }
  .tile.s5 { background: #5f8f1c; color: #f4ffdd; }
  .tile.s6 { background: #84c01c; color: #0a0f04; }
  .tile.s7 { background: #a7e526; color: #0a0f04; }
  .tile.s8 { background: #c8ff2e; color: #06080b; box-shadow: 0 0 22px rgba(200,255,46,0.45); }
  .tile.s9 { background: #e6ff7a; color: #06080b; box-shadow: 0 0 30px rgba(230,255,122,0.6); }
  .tile.s10 { background: linear-gradient(135deg, #c8ff2e, #7fe0ff); color: #04060a; box-shadow: 0 0 34px rgba(127,224,255,0.55); }
  .overlay h1 { font-size: 26px; }
  .mini-stats { display: flex; gap: 8px; }
</style>
</head>
<body>

<header class="hud">
  <div class="hud__brand">
    <span class="hud__mark">G</span>
    <span class="hud__name"><b>TILE 2048</b> · ONN PRIME</span>
  </div>
  <div class="hud__stats">
    <div class="stat"><small>Pontos</small><strong id="score">0</strong></div>
    <div class="stat stat--accent"><small>Recorde</small><strong id="best">0</strong></div>
  </div>
</header>

<main class="stage">
  <div class="board-wrap">
    <div id="board" aria-label="Tabuleiro 2048"></div>

    <div class="overlay" id="start">
      <div class="overlay__badge">◈</div>
      <h1>Tile 2048</h1>
      <p>Deslize para juntar peças iguais. Duas peças iguais viram uma só — chegue em 2048.</p>
      <button class="btn btn--primary" id="btn-start">Jogar</button>
      <p class="hint" style="margin-top:6px">Setas / WASD / deslize na tela</p>
    </div>

    <div class="overlay" id="over" hidden>
      <div class="overlay__label" id="over-label">Fim de jogo</div>
      <div class="big" id="final">0</div>
      <p id="over-msg">Sem movimentos possíveis.</p>
      <div class="overlay__row" style="margin-top:6px">
        <button class="btn btn--primary" id="btn-again">Jogar de novo</button>
        <button class="btn btn--ghost" id="btn-keep">Continuar tentando</button>
      </div>
    </div>
  </div>
</main>

<p class="hint hint--keys">Use <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> ou <kbd>W A S D</kbd> · <kbd>Z</kbd> desfaz o último movimento</p>

<script src="game.js"></script>
</body>
</html>
