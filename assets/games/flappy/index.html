<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Night Bird — Game ONN Prime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23c8ff2e'/%3E%3Cpath d='M25 19.5v25L47 32z' fill='%2305060a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared.css">
<style>
  body { justify-content: center; overflow: auto; }
  .stage { width: min(94vw, 760px); aspect-ratio: 16 / 10; max-height: 74vh; }
  .stage canvas { width: 100%; height: 100%; }
  .hud { max-width: 760px; }
</style>
</head>
<body>

<header class="hud">
  <div class="hud__brand">
    <span class="hud__mark">G</span>
    <span class="hud__name"><b>NIGHT BIRD</b> · ONN PRIME</span>
  </div>
  <div class="hud__stats">
    <div class="stat"><small>Pontos</small><strong id="score">0</strong></div>
    <div class="stat stat--accent"><small>Recorde</small><strong id="best">0</strong></div>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="cv" width="760" height="475" aria-label="Cenário do Night Bird"></canvas>

  <div class="overlay" id="start">
    <div class="overlay__badge">✦</div>
    <h1>Night Bird</h1>
    <p>Toque para bater as asas e atravesse os canos da cidade adormecida.</p>
    <button class="btn btn--primary" id="btn-start">Jogar</button>
    <p class="hint" style="margin-top:6px">Clique, toque ou <kbd>Espaço</kbd></p>
  </div>

  <div class="overlay" id="pause" hidden>
    <h2>Pausado</h2>
    <button class="btn btn--primary" id="btn-resume">Continuar</button>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="overlay__label">Fim do voo</div>
    <div class="big" id="final">0</div>
    <p id="over-msg">Os canos venceram essa.</p>
    <button class="btn btn--primary" id="btn-again">Voar de novo</button>
  </div>
</main>

<p class="hint hint--keys">Clique ou <kbd>Espaço</kbd> para bater as asas · <kbd>P</kbd> pausa</p>

<script src="game.js"></script>
</body>
</html>
