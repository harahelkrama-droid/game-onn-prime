<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory Cards — Game ONN Prime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23c8ff2e'/%3E%3Cpath d='M25 19.5v25L47 32z' fill='%2305060a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared.css">
<style>
  body { overflow: auto; justify-content: center; }
  .stage { width: min(94vw, 560px); padding: 14px; }
  #board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    position: relative;
  }
  .card2 {
    aspect-ratio: 1 / 1.18; border-radius: 11px;
    border: 1px solid var(--line);
    background: linear-gradient(150deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025));
    display: grid; place-items: center; position: relative;
    transition: transform 0.18s ease, border-color 0.2s, background 0.2s;
    transform-style: preserve-3d;
    cursor: pointer; padding: 0;
  }
  .card2:hover:not(.flip):not(.done) { border-color: rgba(200,255,46,0.4); transform: translateY(-2px); }
  .card2 .face {
    position: absolute; inset: 0; display: grid; place-items: center;
    border-radius: inherit; font-size: clamp(20px, 7vw, 34px);
    transition: opacity 0.16s ease, transform 0.22s ease;
  }
  .card2 .back { color: #3b434d; font-size: 17px; }
  .card2 .front { opacity: 0; transform: scale(0.7) rotateY(90deg); color: var(--lime); }
  .card2.flip .back { opacity: 0; transform: scale(0.7); }
  .card2.flip .front { opacity: 1; transform: none; }
  .card2.flip { border-color: rgba(200,255,46,0.45); background: rgba(200,255,46,0.07); }
  .card2.done { border-color: rgba(154,139,255,0.4); background: rgba(154,139,255,0.08); pointer-events: none; }
  .card2.done .front { opacity: 1; transform: none; color: #c3b9ff; }
  .card2.done .back { opacity: 0; }
  .card2.shake { animation: shake 0.34s ease; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .meta { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .meta .stat { min-width: 74px; text-align: left; }
  .overlay { border-radius: 14px; }
</style>
</head>
<body>

<header class="hud">
  <div class="hud__brand">
    <span class="hud__mark">G</span>
    <span class="hud__name"><b>MEMORY CARDS</b> · ONN PRIME</span>
  </div>
  <div class="hud__stats">
    <div class="stat"><small>Jogadas</small><strong id="moves">0</strong></div>
    <div class="stat stat--accent"><small>Pares</small><strong id="pairs">0/8</strong></div>
  </div>
</header>

<main class="stage">
  <div class="meta">
    <div class="stat"><small>Tempo</small><strong id="time">0:00</strong></div>
    <div class="stat"><small>Recorde</small><strong id="best">—</strong></div>
    <div class="stat"><small>Nível</small><strong id="level">Fácil</strong></div>
  </div>

  <div id="board" aria-label="Cartas do jogo da memória"></div>

  <div class="overlay" id="start">
    <div class="overlay__badge">✧</div>
    <h1 style="font-size:22px">Memory Cards</h1>
    <p>Encontre todos os pares de símbolos no menor tempo possível.</p>
    <div class="overlay__row">
      <button class="btn btn--primary" id="btn-start">Começar</button>
      <button class="btn btn--ghost" id="btn-hard">Modo 5x4</button>
    </div>
  </div>

  <div class="overlay" id="win" hidden>
    <div class="overlay__label">Tabuleiro limpo</div>
    <div class="big" id="win-time">0:00</div>
    <p id="win-msg">Boa memória!</p>
    <button class="btn btn--primary" id="btn-again">Jogar de novo</button>
  </div>
</main>

<p class="hint">Clique nas cartas para revelar · os pares ficam abertos · tente bater seu tempo</p>

<script src="game.js"></script>
</body>
</html>
